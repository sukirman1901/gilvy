# Reusable history-story template for the sepia short (ref3).
# Dissolves of about 1.8–2.0s, an expoIn push, and a small rotation.
name: history
style: history-story
effects:
  - shake
  - dissolve
camera:
  ease: expoIn
  scale_max: 2.4
  tracks:
    - property: scale
      keys:
        - {t: 0.0, v: 1.0, ease: expoIn}
        - {t: 1.25, v: 1.166, ease: linear}
    - property: y
      keys:
        - {t: 0.0, v: 0, ease: expoOut}
        - {t: 1.25, v: -48, ease: linear}
    - property: rotation
      keys:
        - {t: 0.0, v: 0, ease: linear}
        - {t: 1.25, v: 1.34, ease: linear}
transition:
  kind: dissolve
  seconds: 2.0
  ease: easeInOutCubic
