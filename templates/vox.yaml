# Reusable vox-explainer template. Numbers are the pinned ref1 inventory
# (tests/fixtures/effects_inventory.yaml), not a new measurement.
name: vox
style: vox-explainer
effects:
  - shake
  - dissolve
  - flash
  - vignette
camera:
  ease: expoOut
  # 140% punch is scale 2.4. Raise scale_max when a reference exceeds it.
  scale_max: 2.4
  tracks:
    - property: scale
      keys:
        - {t: 0.0, v: 1.0, ease: expoIn}
        - {t: 2.336, v: 0.926, ease: linear}
    - property: x
      keys:
        - {t: 0.042, v: 0, ease: expoOut}
        - {t: 0.709, v: 8, ease: linear}
    - property: rotation
      keys:
        - {t: 3.545, v: 0, ease: linear}
        - {t: 5.881, v: 1.11, ease: linear}
transition:
  kind: dissolve
  seconds: 1.46
  ease: easeInCubic
# Photographic look. Overlays: headline (serif), tag (orange label),
# chip (white sans, one word on a red box), card (tilted, shadowed).
# `gilvy cutout photo.jpg --out dir` writes fg.png and bg.png for parallax.
# A scene may set backdrop: cork instead of a full-bleed plate.
look:
  palette:
    red: "#e2372d"
    orange: "#f27a2a"
    sky: "#56b0e8"
    white: "#ffffff"
    ink: "#141414"
  headline: {font: serif, size: 108, color: "#ffffff"}
  tag: {fill: "#f27a2a", font: sans, color: "#ffffff"}
  chip: {font: sans, color: "#ffffff", highlight: "#e2372d"}
  card: {tilt: 8, shadow: 0.55}
  backdrop: cork
  cutout: rembg
