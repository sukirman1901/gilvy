[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gilvy"
version = "0.1.0"
description = "Faceless 9:16 explainer videos with a locked look, for coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "gilvy contributors" }]
keywords = ["video", "motion-graphics", "explainer", "ffmpeg", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pillow==11.3.0",
  "numpy==2.2.6",
  "edge-tts==7.2.7",
  "pyyaml==6.0.2",
  "mcp==1.22.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
download = ["yt-dlp[default]==2026.10.26"]

[project.scripts]
gilvy = "gilvy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gilvy = ["fonts/*", "DIRECTING.md", "MOTION_REFERENCE.md", "PRODUCT_MOTION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Field 'lifespan' has an incomplete definition:Warning",
]
