# Bahasa Indonesia, 9:16, senyap. Tampilan Vox: foto lisensi terbuka,
# subjek dipotong dari latar (fg/bg), judul serif, tag oranye,
# chip kata kunci, kartu miring di papan gabus.
# Sumber dan lisensi ada di CREDITS.md.
#
#   gilvy render examples/bykirman/garam.yaml --tts fixture --out out/bykirman-garam.mp4
#   gilvy qc out/bykirman-garam.mp4

name: bykirman-garam
language: id-ID
style: vox-explainer
audio_mode: silent
version: 1

scenes:
  - id: tambak
    type: image
    green: any
    caption: ["garam mulai", "di tambak."]
    key: ["tambak."]
    min: 4.0
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    layers:
      - {src: plates/rake-bg.jpg, depth: 0.15}
      - {src: plates/rake-fg.webp, depth: 1.0}
    camera:
      ease: linear
      from: {scale: 1.0, x: -18, y: 0}
      to: {scale: 1.10, x: 26, y: 0}
    transition_out: cut
    overlays:
      - {kind: tag, text: TAMBAK, x: 64, y: 168, size: 40}
      - {kind: headline, text: Garam, x: 64, y: 250, size: 128}
      - {kind: chip, text: "panen ini putih", highlight: putih, x: 64, y: 1580, size: 46}

  - id: pikul
    type: image
    green: any
    caption: ["pikulan garam", "itu berat."]
    key: ["berat."]
    min: 4.2
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    layers:
      - {src: plates/pikul-bg.jpg, depth: 0.1}
      - {src: plates/pikul-fg.webp, depth: 1.0}
    camera:
      ease: linear
      from: {scale: 1.0, x: -36, y: 8}
      to: {scale: 1.06, x: 40, y: -8}
    transition_out: cut
    overlays:
      - {kind: tag, text: PIKUL, x: 64, y: 168, size: 40}
      - {kind: chip, text: "beban ini berat", highlight: berat, x: 64, y: 1580, size: 46}

  - id: petani
    type: image
    green: any
    caption: ["petani menggaruk", "garam basah."]
    key: ["menggaruk"]
    min: 3.8
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    layers:
      - {src: plates/petani-bg.jpg, depth: 0.12}
      - {src: plates/petani-fg.webp, depth: 1.0}
    camera:
      ease: linear
      from: {scale: 1.0, x: 0, y: 10}
      to: {scale: 1.12, x: 0, y: -18}
    transition_out: cut
    overlays:
      - {kind: tag, text: PETANI, x: 64, y: 168, size: 40}
      - {kind: chip, text: "kerja di tambak", highlight: tambak, x: 64, y: 1580, size: 46}

  - id: gerobak
    type: image
    green: any
    caption: ["gerobak putih", "di pematang."]
    key: ["putih"]
    min: 3.6
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    effects:
      - {kind: whip, at: 0.95, seconds: 0.28}
    layers:
      - {src: plates/wheel-bg.jpg, depth: 0.2}
      - {src: plates/wheel-fg.webp, depth: 1.0}
    camera:
      tracks:
        - property: scale
          keys:
            - {t: 0.0, v: 1.0, ease: linear}
            - {t: 3.6, v: 1.08, ease: linear}
        - property: y
          keys:
            - {t: 0.0, v: 0, ease: linear}
            - {t: 0.9, v: 0, ease: linear}
            - {t: 1.2, v: 72, ease: expoOut}
            - {t: 3.6, v: 72, ease: linear}
    transition_out: cut
    overlays:
      - {kind: tag, text: GEROBAK, x: 64, y: 168, size: 40}
      - {kind: chip, text: "roda ini putih", highlight: putih, x: 64, y: 1580, size: 46}

  - id: tumpukan
    type: image
    green: any
    caption: ["gunung garam", "sudah kering."]
    key: ["kering."]
    min: 4.0
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    layers:
      - {src: plates/pile-bg.jpg, depth: 0.15}
      - {src: plates/pile-fg.webp, depth: 1.0}
    camera:
      ease: linear
      from: {scale: 1.0, x: 8, y: 6}
      to: {scale: 1.08, x: -10, y: -8}
    transition_out: dissolve
    transition: 1.15
    transition_ease: easeInCubic
    overlays:
      - {kind: chip, text: "gunung putih", highlight: putih, x: 64, y: 1580, size: 48}

  - id: keranjang
    type: image
    green: any
    caption: ["keranjang mengangkut", "butir putih."]
    key: ["mengangkut"]
    min: 4.0
    show_caption: true
    grade: none
    grain: 0
    paper: 0
    layers:
      - {src: plates/baskets-bg.jpg, depth: 0.15}
      - {src: plates/baskets-fg.webp, depth: 1.0}
    camera:
      ease: linear
      from: {scale: 1.0, x: -28, y: 0}
      to: {scale: 1.05, x: 32, y: 0}
    transition_out: cut
    overlays:
      - {kind: chip, text: "keranjang penuh", highlight: penuh, x: 64, y: 1580, size: 46}

  - id: arsip
    type: image
    green: any
    caption: ["arsip tua", "tetap terbaca."]
    key: ["terbaca."]
    min: 4.2
    show_caption: true
    backdrop: cork
    grade: none
    grain: 0
    grain_std: 7
    paper: 0.16
    camera:
      ease: linear
      from: {scale: 1.0, x: 0, y: 18}
      to: {scale: 1.0, x: 0, y: -26}
    transition_out: cut
    overlays:
      - {kind: tag, text: ARSIP, x: 64, y: 120, size: 38}
      - {kind: card, src: plates/cards/madura.jpg, x: 64, y: 200, w: 400, h: 520, tilt: -8, shadow: 0.62}
      - {kind: card, src: plates/cards/aerial.jpg, x: 500, y: 280, w: 460, h: 540, tilt: 9, shadow: 0.55}
      - {kind: card, src: plates/cards/sabu.jpg, x: 160, y: 680, w: 420, h: 420, tilt: 5, shadow: 0.5}
      - {kind: chip, text: "kertas tua", highlight: tua, x: 64, y: 1620, size: 46}

  - id: koin
    type: image
    green: any
    caption: ["satu koin,", "satu mangkuk."]
    key: ["koin,", "mangkuk."]
    min: 3.6
    show_caption: true
    backdrop: cork
    grade: none
    grain: 0
    paper: 0
    camera:
      ease: linear
      from: {scale: 1.0, x: 6, y: 0}
      to: {scale: 1.06, x: -16, y: 0}
    transition_out: match
    transition: 0.55
    match:
      tracks:
        - property: scale
          keys:
            - {t: 0.0, v: 1.0, ease: easeInCubic}
            - {t: 0.55, v: 1.2, ease: linear}
        - property: x
          keys:
            - {t: 0.0, v: 0, ease: easeOutCubic}
            - {t: 0.55, v: 40, ease: linear}
    overlays:
      - {kind: card, src: plates/cards/koin.jpg, x: 80, y: 180, w: 680, h: 640, tilt: 7, shadow: 0.6}
      - {kind: card, src: plates/cards/shaker.jpg, x: 680, y: 620, w: 280, h: 440, tilt: -11, shadow: 0.55}
      - {kind: chip, text: "satu koin", highlight: koin, x: 64, y: 1620, size: 48}

  - id: meja
    type: image
    green: any
    caption: ["garam di meja", "itu asin."]
    key: ["asin."]
    min: 4.0
    show_caption: true
    image: plates/table-bg.jpg
    grade: none
    grain: 0
    paper: 0
    camera:
      ease: linear
      from: {scale: 1.02, x: 0, y: 4}
      to: {scale: 1.08, x: 0, y: -8}
    color:
      tracks:
        - property: sat
          keys:
            - {t: 0.0, v: 1.0, ease: linear}
            - {t: 4.0, v: 1.1, ease: linear}
        - property: bright
          keys:
            - {t: 0.0, v: 1.0, ease: easeInOutCubic}
            - {t: 4.0, v: 1.06, ease: linear}
    transition_out: cut
    overlays:
      - {kind: chip, text: "ini asin", highlight: asin, x: 64, y: 1500, size: 64, fill: [226, 55, 45]}

  - id: dapur
    type: image
    green: any
    caption: ["garam sampai", "ke dapur."]
    key: ["dapur."]
    min: 4.0
    show_caption: true
    image: plates/bowl-bg.jpg
    grade: none
    grain: 0
    paper: 0
    camera:
      ease: linear
      from: {scale: 1.10, x: 0, y: 6}
      to: {scale: 1.0, x: 0, y: -6}
    transition_out: cut
    overlays:
      - {kind: tag, text: DAPUR, x: 64, y: 168, size: 40}
      - {kind: headline, text: Dapur, x: 64, y: 248, size: 120}
      - {kind: chip, text: "sampai dapur", highlight: dapur, x: 64, y: 1580, size: 46}
