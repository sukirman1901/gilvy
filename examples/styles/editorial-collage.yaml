# Technical diagnostic: generated by build_collage_demo.py, not an approved visual standard.
name: collage-diagnostic
style: history-story
audio_mode: silent
scenes:
- id: context
  type: image
  composition: collage
  min: 2
  caption:
  - Context becomes evidence.
  prompt: A printed picture yields attention to an editable page.
  transition_out: cut
  camera:
    from:
      scale: 1
    to:
      scale: 1
  layers:
  - id: paper
    role: background
    src: collage-assets/paper.png
    alpha: opaque
    depth: 0
    prompt: One uninterrupted warm ivory paper surface.
  - id: photo
    role: photo
    src: collage-assets/photo.png
    alpha: opaque
    clock: episode
    depth: 0.5
    prompt: One original graphic landscape print, isolated from other story objects.
    placement:
      x: 350
      y: 1050
      width: 590
      height: 960
      rotation: -9
      fit: cover
      matte: '#f4ecdb'
      padding: 16
    tracks:
    - property: x
      keys:
      - t: 0
        v: 0
      - t: 4
        v: -180
    - property: scale
      keys:
      - t: 0
        v: 1
      - t: 4
        v: 0.72
  - id: page
    role: paper
    src: collage-assets/page.png
    alpha: opaque
    clock: episode
    depth: 1
    prompt: One blank editorial sheet, no text or scenery.
    placement:
      x: 650
      y: 940
      width: 700
      height: 1100
      rotation: -3
    tracks:
    - property: x
      keys:
      - t: 0
        v: 400
      - t: 4
        v: -110
    - property: rotation
      keys:
      - t: 0
        v: 0
      - t: 4
        v: 3
    - property: scale
      keys:
      - t: 0
        v: 0.6
      - t: 4
        v: 1.1
    - property: opacity
      keys:
      - t: 0
        v: 0
      - t: 0.7
        v: 0
      - t: 1.4
        v: 1
  overlays:
  - kind: text
    parent: page
    clock: episode
    at: 1
    text: DETAIL
    layout: line
    font: serif
    size: 88
    x: 350
    y: 520
    hold: 8
    color: '#332c24'
  - kind: circle
    parent: page
    clock: episode
    at: 1.8
    duration: 1
    cx: 350
    cy: 520
    r: 210
    width: 5
